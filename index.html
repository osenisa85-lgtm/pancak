      <h2>step on how to prepare caramel apple cake</h2>
      <li>You need 1 cup brown sugar, 1/2 cup butter, 1/4 cup milk or heavy cream, 1 teaspoon vanilla extract, and a pinch of salt. Measure everything before you start, because caramel moves fast once it's on the heat</li>
      <li>Put the butter in a medium saucepan over medium heat. Let it melt completely, stirring occasionally so it doesn't brown or burn.</li
      <li>Pour in the brown sugar and stir with a wooden spoon or whisk until it's mixed into the butter and looks like a thick, grainy paste</li>
      <li>Bring the mixture to a gentle boil and let it bubble for about 2 minutes, stirring constantly. The sugar should dissolve and the mixture should turn glossy</li>
      </ol>
